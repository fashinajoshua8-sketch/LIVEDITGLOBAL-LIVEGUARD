<form class="scan" id="token-form">
  <div class="search-wrap">
    <input
      id="token-input"
      type="text"
      placeholder="Token mint address"
      spellcheck="false"
      autocomplete="off"
    />
    <button
      class="clear-input"
      id="clear-token"
      type="button"
      aria-label="Clear token address"
      title="Clear"
    >×</button>
  </div>

  <button class="btn" type="submit">Scan token</button>
</form>
